<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo 4 - Compras</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <h1>Modulo 4 - Gestion de Compras</h1>
  <a href="../index.html">Volver al sistema</a>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('ordenes', this)">Ordenes de Compra</button>
    <button class="tab-btn" onclick="switchTab('nueva-orden', this)">Nueva Orden</button>
    <button class="tab-btn" onclick="switchTab('detalle-orden', this)">Detalle de Orden</button>
    <button class="tab-btn" onclick="switchTab('por-proveedor', this)">Por Proveedor</button>
  </div>

  <!-- TAB: ORDENES DE COMPRA -->
  <div class="tab-content active" id="tab-ordenes">
    <div class="card">
      <div class="table-header">
        <h3>Ordenes de Compra</h3>
        <input class="search" placeholder="Buscar..." oninput="filtrarTabla('tbl-ordenes', this.value)">
      </div>
      <div id="cont-ordenes"><p>Cargando...</p></div>
    </div>
  </div>

  <!-- TAB: NUEVA ORDEN -->
  <div class="tab-content" id="tab-nueva-orden">
    <div class="card">
      <h3>Registrar Nueva Orden de Compra</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Fecha de Orden *</label>
          <input id="no-fecha" type="date">
        </div>
        <div class="form-group">
          <label>ID Estado de Orden *</label>
          <input id="no-idestado" type="number" placeholder="ID del estado de la orden">
        </div>
        <div class="form-group">
          <label>ID Proveedor *</label>
          <input id="no-idproveedor" type="number" placeholder="ID del proveedor">
        </div>
        <div class="form-group">
          <label>Monto Total (Bs) *</label>
          <input id="no-monto" type="number" step="0.01" placeholder="0.00">
        </div>
      </div>
      <br>
      <button class="btn btn-primary" onclick="crearOrden()">Crear Orden</button>
      <div id="msg-orden" class="msg"></div>
    </div>
  </div>

  <!-- TAB: DETALLE DE ORDEN -->
  <div class="tab-content" id="tab-detalle-orden">
    <div class="card">
      <h3>Detalle de Orden de Compra</h3>
      <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:16px;">
        <div class="form-group">
          <label>ID Orden de Compra</label>
          <input id="do-idorden" type="number" placeholder="Ingresa el ID de la orden">
        </div>
        <button class="btn btn-primary" onclick="buscarDetalle()">Buscar</button>
      </div>
      <div id="cont-detalle-orden"></div>
    </div>
  </div>

  <!-- TAB: POR PROVEEDOR -->
  <div class="tab-content" id="tab-por-proveedor">
    <div class="card">
      <h3>Ordenes por Proveedor</h3>
      <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:16px;">
        <div class="form-group">
          <label>ID Proveedor</label>
          <input id="pp-idproveedor" type="number" placeholder="Ingresa el ID del proveedor">
        </div>
        <button class="btn btn-primary" onclick="buscarPorProveedor()">Buscar</button>
      </div>
      <div id="cont-por-proveedor"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
