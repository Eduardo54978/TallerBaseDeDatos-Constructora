<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora - Movimientos del Sistema</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <h1>Bitácora — Movimientos del Sistema</h1>
  <a href="../index.html">Volver al sistema</a>
</div>

<div class="container">
  <div class="card">
    <p style="color:#6b756d; margin-bottom:16px;">
      Registro de todas las acciones del sistema: quién inició sesión y quién creó, editó o eliminó información en cada módulo.
      Solo visible para el rol Gerente.
    </p>

    <div id="stat-grid" class="stat-grid"></div>

    <div id="cards-resumen" class="cards-resumen"></div>

    <div style="display:flex; justify-content:flex-end; gap:10px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap;">
      <div class="form-group" style="min-width:170px;">
        <label>Limpiar movimientos</label>
        <select id="limpiar-rango">
          <option value="0">Todos</option>
          <option value="7">Anteriores a 7 días</option>
          <option value="30">Anteriores a 30 días</option>
          <option value="90">Anteriores a 90 días</option>
        </select>
      </div>
      <button class="btn btn-red" style="padding:9px 16px;" onclick="limpiarBitacora()">Limpiar bitácora</button>
    </div>

    <div class="filtros">
      <div class="form-group">
        <label>Buscar (usuario o detalle)</label>
        <input id="f-q" class="search" style="width:100%" placeholder="Nombre, usuario, texto..." oninput="cargarBitacora()">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="f-rol" onchange="cargarBitacora()">
          <option value="">Todos</option>
          <option value="rol_gerente">Gerente</option>
          <option value="rol_contador">Contador</option>
          <option value="rol_jefe_obra">Jefe de obra</option>
          <option value="rol_rrhh">RR.HH.</option>
          <option value="rol_secretaria">Secretaria</option>
          <option value="rol_logistica">Logística</option>
          <option value="rol_consulta">Consulta</option>
        </select>
      </div>
      <div class="form-group">
        <label>Acción</label>
        <select id="f-accion" onchange="cargarBitacora()">
          <option value="">Todas</option>
          <option value="LOGIN">Inicio de sesión</option>
          <option value="CREAR">Crear</option>
          <option value="EDITAR">Editar</option>
          <option value="ELIMINAR">Eliminar</option>
        </select>
      </div>
      <div class="form-group">
        <label>Módulo</label>
        <select id="f-modulo" onchange="cargarBitacora()">
          <option value="">Todos</option>
          <option value="login">Login</option>
          <option value="proyectos">Proyectos</option>
          <option value="materiales">Materiales</option>
          <option value="pagos">Pagos</option>
          <option value="compras">Compras</option>
          <option value="contratos">Contratos</option>
          <option value="proveedores">Proveedores</option>
          <option value="clientes">Clientes</option>
          <option value="empleados">Empleados</option>
          <option value="cotizaciones">Cotizaciones</option>
          <option value="cuotas">Cuotas</option>
          <option value="empleadoproyecto">Empleado-Proyecto</option>
          <option value="materialproyecto">Material-Proyecto</option>
        </select>
      </div>
      <button class="btn btn-accent" style="padding:9px 16px;" onclick="cargarBitacora()">Actualizar</button>
    </div>

    <div id="cont-bitacora"><p>Cargando movimientos...</p></div>
  </div>
</div>

<script src="../js/autocomplete.js"></script>
<script src="script.js"></script>
</body>
</html>
