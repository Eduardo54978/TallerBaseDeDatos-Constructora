<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Módulo 10 - Reportes Generales</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="topbar">
    <h1>Módulo 10 - Reportes Generales</h1>

    <a href="../index.html">
      Volver al sistema
    </a>
  </div>

  <main class="container">

    <!-- Tarjetas con resumen general -->
    <section
      id="rep-stats"
      class="rep-stats"
      aria-label="Resumen general"
    >
      <div class="sb">
        <div class="l">
          Cargando resumen...
        </div>
      </div>
    </section>

    <!-- Buscador general -->
    <section class="card">

      <h3>Buscador general</h3>

      <p class="rep-descripcion">
        Busca por <strong>ID</strong> o <strong>nombre</strong>:
        proyectos, empleados, materiales, clientes o proveedores.
      </p>

      <div class="rep-buscador">
        <input
          id="rep-q"
          type="search"
          placeholder="Escribe un ID o nombre..."
          autocomplete="off"
          oninput="buscarGlobal()"
        >
      </div>

      <div
        class="rep-tipos"
        id="rep-tipos"
        aria-label="Tipos de búsqueda"
      >
        <button
          type="button"
          class="rep-tipo active"
          data-tipo=""
          onclick="setTipo(this)"
        >
          Todo
        </button>

        <button
          type="button"
          class="rep-tipo"
          data-tipo="proyecto"
          onclick="setTipo(this)"
        >
          Proyectos
        </button>

        <button
          type="button"
          class="rep-tipo"
          data-tipo="empleado"
          onclick="setTipo(this)"
        >
          Empleados
        </button>

        <button
          type="button"
          class="rep-tipo"
          data-tipo="material"
          onclick="setTipo(this)"
        >
          Materiales
        </button>

        <button
          type="button"
          class="rep-tipo"
          data-tipo="cliente"
          onclick="setTipo(this)"
        >
          Clientes
        </button>

        <button
          type="button"
          class="rep-tipo"
          data-tipo="proveedor"
          onclick="setTipo(this)"
        >
          Proveedores y catálogos
        </button>
      </div>

      <div
        id="rep-resultados"
        class="rep-resultados"
        aria-live="polite"
      ></div>

    </section>

    <!-- Detalle del registro seleccionado -->
    <section
      id="rep-detalle"
      class="card"
      style="display:none;"
      aria-live="polite"
    ></section>

  </main>

  <!-- Funciones para abrir e imprimir reportes -->
  <script src="../js/imprimirPDF.js"></script>

  <!-- Funciones de rango de fechas -->
  <script src="../js/reportes.js"></script>

  <!-- Código propio del módulo -->
  <script src="script.js"></script>

</body>

</html>
